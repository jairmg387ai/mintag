<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Mintag — Meeting Task Tracker</title>
<style>
:root{
  --bg:#0f172a;--surface:#1e293b;--surface2:#273549;--surface3:#334155;
  --border:#334155;--border2:#475569;
  --text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;
  --blue:#3b82f6;--blue-dim:#1d4ed8;--blue-bg:rgba(59,130,246,.12);
  --green:#22c55e;--green-bg:rgba(34,197,94,.12);
  --yellow:#eab308;--yellow-bg:rgba(234,179,8,.12);
  --red:#ef4444;--red-bg:rgba(239,68,68,.12);
  --orange:#f97316;--orange-bg:rgba(249,115,22,.12);
  --purple:#a855f7;--purple-bg:rgba(168,85,247,.12);
  --radius:10px;--shadow:0 4px 24px rgba(0,0,0,.4);
  --font:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;font-size:14px}

/* Layout */
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;height:100vh;position:sticky;top:0}
.main{flex:1;overflow-y:auto;min-height:100vh}

/* Sidebar */
.sidebar-logo{padding:20px 16px 12px;font-size:1.2em;font-weight:700;color:var(--blue);letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.sidebar-logo svg{flex-shrink:0}
.nav-section{padding:8px 0;border-top:1px solid var(--border)}
.nav-label{font-size:.68em;font-weight:600;letter-spacing:.8px;color:var(--text3);padding:6px 16px 2px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 16px;color:var(--text2);cursor:pointer;border-radius:0;transition:all .15s;font-size:.88em;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--blue-bg);color:var(--blue);font-weight:600}
.nav-item svg{flex-shrink:0;opacity:.7}
.nav-item.active svg{opacity:1}

/* Project pill in sidebar */
.proj-pill{display:flex;align-items:center;gap:8px;padding:6px 14px;cursor:pointer;border-radius:0;border:none;background:none;width:100%;text-align:left;color:var(--text2);font-size:.85em;transition:all .15s}
.proj-pill:hover{background:var(--surface2);color:var(--text)}
.proj-pill.active{background:var(--blue-bg);color:var(--text)}
.proj-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* Header bar */
.topbar{padding:16px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--surface);position:sticky;top:0;z-index:10}
.topbar h1{font-size:1.1em;font-weight:600}
.topbar-actions{margin-left:auto;display:flex;gap:8px}

/* Content area */
.content{padding:24px 28px}

/* Stats row */
.stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.stat-label{font-size:.72em;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.stat-value{font-size:1.8em;font-weight:700}
.stat-value.blue{color:var(--blue)}
.stat-value.green{color:var(--green)}
.stat-value.yellow{color:var(--yellow)}
.stat-value.red{color:var(--red)}
.stat-value.orange{color:var(--orange)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;border:none;cursor:pointer;font-size:.85em;font-weight:500;transition:all .15s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-dim)}
.btn-ghost{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface3);color:var(--text)}
.btn-sm{padding:4px 10px;font-size:.78em}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid rgba(239,68,68,.3)}

/* Inputs */
input,textarea,select{
  background:var(--surface2);border:1px solid var(--border);border-radius:7px;
  color:var(--text);padding:8px 12px;font-size:.88em;font-family:var(--font);width:100%;
  outline:none;transition:border-color .15s
}
input:focus,textarea:focus,select:focus{border-color:var(--blue)}
label{font-size:.8em;color:var(--text2);margin-bottom:4px;display:block;font-weight:500}
.field{margin-bottom:14px}
textarea{resize:vertical;min-height:80px}
select option{background:var(--surface2)}

/* Search bar */
.search-wrap{position:relative;flex:1;max-width:380px}
.search-wrap input{padding-left:34px}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.card-header h2{font-size:.95em;font-weight:600}
.card-body{padding:18px}

/* Task list */
.task-list{display:flex;flex-direction:column;gap:0}
.task-row{display:grid;grid-template-columns:28px 1fr 110px 120px 90px 90px 32px;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--border);transition:background .1s;cursor:pointer}
.task-row:last-child{border-bottom:none}
.task-row:hover{background:var(--surface2)}
.task-title{font-size:.9em;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-desc{font-size:.78em;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-list-header{display:grid;grid-template-columns:28px 1fr 110px 120px 90px 90px 32px;gap:12px;padding:8px 16px;background:var(--surface2);font-size:.72em;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text3)}

/* Status badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:.75em;font-weight:600;white-space:nowrap}
.badge-todo{background:var(--surface3);color:var(--text2)}
.badge-in_progress{background:var(--blue-bg);color:var(--blue)}
.badge-blocked{background:var(--red-bg);color:var(--red)}
.badge-done{background:var(--green-bg);color:var(--green)}
.badge-cancelled{background:var(--surface3);color:var(--text3)}

/* Priority dot */
.prio{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.prio-low{background:var(--text3)}
.prio-medium{background:var(--blue)}
.prio-high{background:var(--orange)}
.prio-critical{background:var(--red)}

/* Owner avatar */
.avatar{width:26px;height:26px;border-radius:50%;background:var(--blue-dim);color:#fff;font-size:.7em;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}

/* Meetings */
.meeting-list{display:flex;flex-direction:column;gap:10px}
.meeting-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .15s}
.meeting-card:hover{background:var(--surface2);border-color:var(--border2)}
.meeting-date{font-size:.75em;color:var(--text3);font-weight:600;min-width:84px}
.meeting-title{font-weight:500;font-size:.92em;flex:1}
.meeting-meta{display:flex;gap:8px;align-items:center}
.pill{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:2px 9px;font-size:.72em;color:var(--text2)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:14px;width:100%;max-width:640px;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.modal-header h2{font-size:1em;font-weight:600;flex:1}
.modal-close{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px;border-radius:6px;display:flex}
.modal-close:hover{color:var(--text);background:var(--surface3)}
.modal-body{padding:20px 22px;overflow-y:auto;flex:1}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}

/* Timeline */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:'';position:absolute;left:7px;top:8px;bottom:0;width:2px;background:var(--border)}
.tl-item{position:relative;margin-bottom:18px}
.tl-dot{position:absolute;left:-18px;top:4px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg);background:var(--blue)}
.tl-dot.green{background:var(--green)}
.tl-dot.yellow{background:var(--yellow)}
.tl-dot.red{background:var(--red)}
.tl-time{font-size:.72em;color:var(--text3);margin-bottom:2px}
.tl-content{background:var(--surface2);border-radius:8px;padding:10px 14px}
.tl-status{font-size:.78em;font-weight:600;margin-bottom:4px}
.tl-note{font-size:.83em;color:var(--text2)}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.kanban-col{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.kanban-col-header{padding:10px 14px;font-size:.78em;font-weight:600;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.kanban-cards{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:60px}
.kanban-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;cursor:pointer;transition:all .15s}
.kanban-card:hover{border-color:var(--border2);background:var(--surface3)}
.kanban-card-title{font-size:.88em;font-weight:500;margin-bottom:6px;line-height:1.4}
.kanban-card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* Empty state */
.empty{text-align:center;padding:48px 24px;color:var(--text3)}
.empty svg{margin:0 auto 12px;display:block;opacity:.3}
.empty p{font-size:.9em}

/* Toast */
#toast{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast-item{background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:10px 16px;font-size:.85em;color:var(--text);box-shadow:var(--shadow);animation:slideIn .2s ease}
.toast-item.error{border-color:var(--red);background:var(--red-bg)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* View toggle */
.view-toggle{display:flex;background:var(--surface2);border-radius:7px;padding:2px;gap:2px}
.view-btn{background:none;border:none;color:var(--text3);cursor:pointer;padding:5px 8px;border-radius:5px;display:flex;transition:all .15s}
.view-btn.active{background:var(--surface3);color:var(--text)}

/* Filter bar */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter-chip{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:.78em;cursor:pointer;color:var(--text2);transition:all .15s;white-space:nowrap}
.filter-chip:hover{border-color:var(--border2);color:var(--text)}
.filter-chip.active{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}

/* Section heading */
.section-title{font-size:.8em;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:12px}

/* Responsive */
@media(max-width:900px){
  .sidebar{width:56px}
  .sidebar-logo span,.nav-label,.nav-item span,.proj-pill span{display:none}
  .nav-item{justify-content:center;padding:10px}
  .kanban{grid-template-columns:1fr 1fr}
  .task-list-header,.task-row{grid-template-columns:28px 1fr 90px 90px 32px}
  .task-list-header .col-meeting,.task-row .col-meeting{display:none}
}
</style>
</head>
<body>

<!-- Sidebar -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 12l2 2 4-4"/></svg>
    <span>mintag</span>
  </div>
  <div class="nav-section">
    <button class="nav-item active" onclick="showView('dashboard')" id="nav-dashboard">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
      <span>Dashboard</span>
    </button>
    <button class="nav-item" onclick="showView('tasks')" id="nav-tasks">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><rect x="3" y="3" width="18" height="18" rx="3"/></svg>
      <span>Tareas</span>
    </button>
    <button class="nav-item" onclick="showView('meetings')" id="nav-meetings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Reuniones</span>
    </button>
  </div>
  <div class="nav-section">
    <div class="nav-label">Proyectos</div>
    <div id="project-nav"></div>
    <button class="nav-item" onclick="openNewProject()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span>Nuevo proyecto</span>
    </button>
  </div>
</nav>

<!-- Main -->
<div class="main">

  <!-- Dashboard view -->
  <div id="view-dashboard">
    <div class="topbar">
      <h1>Dashboard</h1>
      <div class="topbar-actions">
        <div class="search-wrap">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" placeholder="Buscar tareas y reuniones..." id="global-search" oninput="debounceSearch(this.value)"/>
        </div>
      </div>
    </div>
    <div class="content">
      <div class="stats-row" id="stats-row"></div>
      <div id="search-results" style="display:none;margin-bottom:20px"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
        <div class="card">
          <div class="card-header">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
            <h2>Tareas bloqueadas / en progreso</h2>
          </div>
          <div class="card-body" id="dash-active-tasks" style="padding:0"></div>
        </div>
        <div class="card">
          <div class="card-header">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            <h2>Reuniones recientes</h2>
          </div>
          <div class="card-body" id="dash-meetings" style="padding:12px"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tasks view -->
  <div id="view-tasks" style="display:none">
    <div class="topbar">
      <h1>Tareas</h1>
      <div class="topbar-actions">
        <div class="view-toggle">
          <button class="view-btn active" onclick="setTaskView('list')" id="vbtn-list" title="Lista">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </button>
          <button class="view-btn" onclick="setTaskView('kanban')" id="vbtn-kanban" title="Kanban">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="5" height="18" rx="1"/><rect x="10" y="3" width="5" height="12" rx="1"/><rect x="17" y="3" width="5" height="15" rx="1"/></svg>
          </button>
        </div>
        <button class="btn btn-primary btn-sm" onclick="openNewTask()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nueva tarea
        </button>
      </div>
    </div>
    <div class="content">
      <div class="filter-bar" id="task-filters">
        <span class="filter-chip active" data-filter="all" onclick="filterTasks('all',this)">Todas</span>
        <span class="filter-chip" data-filter="todo" onclick="filterTasks('todo',this)">To Do</span>
        <span class="filter-chip" data-filter="in_progress" onclick="filterTasks('in_progress',this)">En progreso</span>
        <span class="filter-chip" data-filter="blocked" onclick="filterTasks('blocked',this)">Bloqueadas</span>
        <span class="filter-chip" data-filter="done" onclick="filterTasks('done',this)">Hechas</span>
      </div>
      <div id="tasks-list-view">
        <div class="card">
          <div class="task-list-header">
            <span></span><span>Tarea</span><span>Estado</span>
            <span class="col-meeting">Reunión</span><span>Responsable</span><span>Prioridad</span><span></span>
          </div>
          <div class="task-list" id="tasks-table-body"></div>
        </div>
      </div>
      <div id="tasks-kanban-view" class="kanban" style="display:none"></div>
    </div>
  </div>

  <!-- Meetings view -->
  <div id="view-meetings" style="display:none">
    <div class="topbar">
      <h1>Reuniones</h1>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" onclick="openImportMeeting()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Importar reunión
        </button>
      </div>
    </div>
    <div class="content">
      <div class="meeting-list" id="meeting-list"></div>
    </div>
  </div>

</div>

<!-- ===== MODALS ===== -->

<!-- Task detail modal -->
<div class="modal-overlay" id="task-modal" style="display:none" onclick="closeModal('task-modal')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2 id="task-modal-title">Detalle de tarea</h2>
      <button class="modal-close" onclick="closeModal('task-modal')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="task-modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" onclick="closeModal('task-modal')">Cerrar</button>
      <button class="btn btn-primary btn-sm" onclick="submitTaskUpdate()">Guardar cambios</button>
    </div>
  </div>
</div>

<!-- New task modal -->
<div class="modal-overlay" id="new-task-modal" style="display:none" onclick="closeModal('new-task-modal')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2>Nueva tarea</h2>
      <button class="modal-close" onclick="closeModal('new-task-modal')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field"><label>Título *</label><input id="nt-title" placeholder="Qué hay que hacer..."/></div>
      <div class="field"><label>Descripción</label><textarea id="nt-desc" placeholder="Contexto y detalles..."></textarea></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="field"><label>Responsable</label><input id="nt-owner" placeholder="Nombre"/></div>
        <div class="field"><label>Prioridad</label>
          <select id="nt-priority">
            <option value="low">Baja</option>
            <option value="medium" selected>Media</option>
            <option value="high">Alta</option>
            <option value="critical">Crítica</option>
          </select>
        </div>
        <div class="field"><label>Estado</label>
          <select id="nt-status">
            <option value="todo">To Do</option>
            <option value="in_progress">En progreso</option>
            <option value="blocked">Bloqueada</option>
          </select>
        </div>
        <div class="field"><label>Fecha límite</label><input type="date" id="nt-due"/></div>
      </div>
      <div class="field"><label>Proyecto</label>
        <select id="nt-project"></select>
      </div>
      <div class="field"><label>Reunión origen (opcional)</label>
        <select id="nt-meeting"><option value="">— ninguna —</option></select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" onclick="closeModal('new-task-modal')">Cancelar</button>
      <button class="btn btn-primary btn-sm" onclick="submitNewTask()">Crear tarea</button>
    </div>
  </div>
</div>

<!-- Import meeting modal -->
<div class="modal-overlay" id="import-modal" style="display:none" onclick="closeModal('import-modal')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2>Importar reunión</h2>
      <button class="modal-close" onclick="closeModal('import-modal')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field"><label>Ruta del archivo (.vtt o .txt)</label><input id="imp-path" placeholder="E:\RUNT 2.0\...\reunion.vtt"/></div>
      <div class="field"><label>Proyecto</label><select id="imp-project"></select></div>
      <div class="field"><label>Resumen (opcional)</label><textarea id="imp-summary" placeholder="Puntos clave de la reunión..."></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" onclick="closeModal('import-modal')">Cancelar</button>
      <button class="btn btn-primary btn-sm" onclick="submitImport()">Importar</button>
    </div>
  </div>
</div>

<!-- New project modal -->
<div class="modal-overlay" id="new-project-modal" style="display:none" onclick="closeModal('new-project-modal')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2>Nuevo proyecto</h2>
      <button class="modal-close" onclick="closeModal('new-project-modal')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field"><label>Nombre *</label><input id="np-name" placeholder="RUNT 2.0 — Bridge"/></div>
      <div class="field"><label>Descripción</label><input id="np-desc" placeholder="Breve descripción..."/></div>
      <div class="field"><label>Color</label><input type="color" id="np-color" value="#3b82f6" style="height:38px;padding:2px 6px"/></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" onclick="closeModal('new-project-modal')">Cancelar</button>
      <button class="btn btn-primary btn-sm" onclick="submitNewProject()">Crear</button>
    </div>
  </div>
</div>

<!-- Toast container -->
<div id="toast"></div>

<script>
const API = '';
let state = { projects:[], meetings:[], tasks:[], currentView:'dashboard', taskView:'list', filterStatus:'all', activeProject:null, editingTaskId:null };
let searchTimer = null;

// ===== API =====
async function api(path, opts={}) {
  const r = await fetch(API+path, {headers:{'Content-Type':'application/json'},...opts});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
const get = path => api(path);
const post = (path,body) => api(path,{method:'POST',body:JSON.stringify(body)});
const put = (path,body) => api(path,{method:'PUT',body:JSON.stringify(body)});

// ===== INIT =====
async function init() {
  await loadAll();
  renderDashboard();
}

async function loadAll() {
  [state.projects, state.meetings, state.tasks] = await Promise.all([
    get('/api/projects').catch(()=>[]),
    get('/api/meetings').catch(()=>[]),
    get('/api/tasks').catch(()=>[]),
  ]);
  renderProjectNav();
}

// ===== VIEWS =====
function showView(v) {
  ['dashboard','tasks','meetings'].forEach(id => {
    document.getElementById('view-'+id).style.display = id===v?'':'none';
    document.getElementById('nav-'+id)?.classList.toggle('active', id===v);
  });
  state.currentView = v;
  if(v==='dashboard') renderDashboard();
  if(v==='tasks') renderTasks();
  if(v==='meetings') renderMeetings();
}

// ===== DASHBOARD =====
async function renderDashboard() {
  const stats = await get('/api/stats').catch(()=>({total_tasks:0,todo_tasks:0,in_progress_tasks:0,blocked_tasks:0,done_tasks:0,total_meetings:0,total_projects:0}));
  const sr = document.getElementById('stats-row');
  sr.innerHTML = `
    ${statCard('Total tareas', stats.total_tasks, 'blue')}
    ${statCard('To Do', stats.todo_tasks, '')}
    ${statCard('En progreso', stats.in_progress_tasks, 'blue')}
    ${statCard('Bloqueadas', stats.blocked_tasks, 'red')}
    ${statCard('Hechas', stats.done_tasks, 'green')}
    ${statCard('Reuniones', stats.total_meetings, 'orange')}
  `;

  const active = state.tasks.filter(t=>t.status==='blocked'||t.status==='in_progress');
  const at = document.getElementById('dash-active-tasks');
  if(!active.length) {
    at.innerHTML = '<div class="empty"><p>Sin tareas activas</p></div>';
  } else {
    at.innerHTML = '<div class="task-list">'+active.slice(0,8).map(taskRow).join('')+'</div>';
  }

  const dm = document.getElementById('dash-meetings');
  const recent = [...state.meetings].sort((a,b)=>b.id-a.id).slice(0,5);
  dm.innerHTML = recent.length ? recent.map(meetingMini).join('') : '<div class="empty"><p>Sin reuniones</p></div>';
}

function statCard(label,val,color) {
  return `<div class="stat-card"><div class="stat-label">${label}</div><div class="stat-value ${color}">${val}</div></div>`;
}

function meetingMini(m) {
  return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="openMeetingDetail(${m.id})">
    <span style="font-size:.72em;color:var(--text3);min-width:80px">${m.date||'—'}</span>
    <span style="font-size:.85em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.title}</span>
    <span class="pill">${m.task_count||0} tareas</span>
  </div>`;
}

// ===== TASKS =====
function renderTasks() {
  let tasks = state.tasks;
  if(state.activeProject) tasks = tasks.filter(t=>t.project_id==state.activeProject);
  if(state.filterStatus!=='all') tasks = tasks.filter(t=>t.status===state.filterStatus);

  if(state.taskView==='list') {
    document.getElementById('tasks-table-body').innerHTML = tasks.length
      ? tasks.map(taskRow).join('')
      : '<div class="empty"><p>Sin tareas</p></div>';
  } else {
    renderKanban(tasks);
  }
}

function taskRow(t) {
  return `<div class="task-row" onclick="openTaskDetail(${t.id})">
    <div class="prio prio-${t.priority||'medium'}"></div>
    <div><div class="task-title">${esc(t.title)}</div><div class="task-desc">${esc(t.project_name||'')}${t.meeting_title?' · '+esc(t.meeting_title):''}</div></div>
    <div>${statusBadge(t.status)}</div>
    <div class="col-meeting" style="font-size:.78em;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.meeting_title||'—')}</div>
    <div>${t.owner?avatarHtml(t.owner):'<span style="color:var(--text3);font-size:.78em">—</span>'}</div>
    <div style="font-size:.78em;color:var(--text3)">${prioBadge(t.priority)}</div>
    <div>
      <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openTaskDetail(${t.id})" style="padding:3px 6px">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </button>
    </div>
  </div>`;
}

function renderKanban(tasks) {
  const cols = [
    {status:'todo',label:'To Do',color:'var(--text2)'},
    {status:'in_progress',label:'En progreso',color:'var(--blue)'},
    {status:'blocked',label:'Bloqueado',color:'var(--red)'},
    {status:'done',label:'Hecho',color:'var(--green)'},
  ];
  const kv = document.getElementById('tasks-kanban-view');
  kv.innerHTML = cols.map(col=>{
    const colTasks = tasks.filter(t=>t.status===col.status);
    return `<div class="kanban-col">
      <div class="kanban-col-header" style="color:${col.color}">
        ${col.label}
        <span style="background:var(--surface3);border-radius:12px;padding:1px 8px;color:var(--text3);font-size:.85em">${colTasks.length}</span>
      </div>
      <div class="kanban-cards">
        ${colTasks.map(kanbanCard).join('')}
        ${colTasks.length===0?'<div style="text-align:center;padding:20px;color:var(--text3);font-size:.78em">Vacío</div>':''}
      </div>
    </div>`;
  }).join('');
}

function kanbanCard(t) {
  return `<div class="kanban-card" onclick="openTaskDetail(${t.id})">
    <div class="kanban-card-title">${esc(t.title)}</div>
    <div class="kanban-card-meta">
      <div class="prio prio-${t.priority||'medium'}"></div>
      ${t.owner?avatarHtml(t.owner):''}
      ${t.project_name?`<span class="pill">${esc(t.project_name)}</span>`:''}
    </div>
  </div>`;
}

function setTaskView(v) {
  state.taskView = v;
  document.getElementById('tasks-list-view').style.display = v==='list'?'':'none';
  document.getElementById('tasks-kanban-view').style.display = v==='kanban'?'':'none';
  document.getElementById('vbtn-list').classList.toggle('active',v==='list');
  document.getElementById('vbtn-kanban').classList.toggle('active',v==='kanban');
  renderTasks();
}

function filterTasks(status, el) {
  state.filterStatus = status;
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderTasks();
}

// ===== MEETINGS =====
function renderMeetings() {
  let meetings = state.meetings;
  if(state.activeProject) meetings = meetings.filter(m=>m.project_id==state.activeProject);
  const el = document.getElementById('meeting-list');
  el.innerHTML = meetings.length
    ? meetings.map(m=>`<div class="meeting-card" onclick="openMeetingDetail(${m.id})">
        <span class="meeting-date">${m.date||'—'}</span>
        <span class="meeting-title">${esc(m.title)}</span>
        <div class="meeting-meta">
          ${m.task_count?`<span class="pill">${m.task_count} tareas</span>`:''}
          ${projectColor(m.project_id)}
        </div>
      </div>`).join('')
    : '<div class="empty"><p>Sin reuniones importadas</p></div>';
}

// ===== TASK DETAIL MODAL =====
async function openTaskDetail(id) {
  state.editingTaskId = id;
  const [task, history] = await Promise.all([
    get('/api/tasks/'+id),
    get('/api/tasks/'+id+'/history'),
  ]);
  document.getElementById('task-modal-title').textContent = task.title;
  document.getElementById('task-modal-body').innerHTML = taskDetailHTML(task, history);
  document.getElementById('task-modal').style.display = 'flex';
}

function taskDetailHTML(t, history) {
  const meetings = state.meetings.map(m=>`<option value="${m.id}" ${''}>📅 ${m.date} — ${esc(m.title)}</option>`).join('');
  return `
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
    <div class="field"><label>Estado</label>
      <select id="edit-status">
        ${['todo','in_progress','blocked','done','cancelled'].map(s=>`<option value="${s}" ${s===t.status?'selected':''}>${statusLabel(s)}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>Prioridad</label>
      <select id="edit-priority">
        ${['low','medium','high','critical'].map(s=>`<option value="${s}" ${s===t.priority?'selected':''}>${prioLabel(s)}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>Responsable</label><input id="edit-owner" value="${esc(t.owner||'')}"/></div>
    <div class="field"><label>Fecha límite</label><input type="date" id="edit-due" value="${t.due_date||''}"/></div>
  </div>
  <div class="field"><label>Descripción</label><textarea id="edit-desc">${esc(t.description||'')}</textarea></div>
  <div class="field"><label>Nota de actualización</label><input id="edit-note" placeholder="Por qué cambia / qué se discutió..."/></div>
  <div class="field"><label>Reunión que motivó este cambio</label>
    <select id="edit-src-meeting"><option value="">— ninguna —</option>${meetings}</select>
  </div>
  <div class="field"><label>Quién actualiza</label><input id="edit-author" placeholder="Tu nombre..."/></div>

  ${history&&history.length?`
  <div style="margin-top:20px">
    <div class="section-title">Historial de cambios</div>
    <div class="timeline">${history.map(tlItem).join('')}</div>
  </div>`:''}

  <div style="margin-top:16px;padding:12px;background:var(--surface2);border-radius:8px;font-size:.8em;color:var(--text3)">
    Creada ${fmt(t.created_at)} · Proyecto: ${t.project_name||'—'} · Reunión origen: ${t.meeting_title||'—'}
  </div>
  `;
}

function tlItem(h) {
  const changed = h.old_status !== h.new_status;
  const dotClass = h.new_status==='done'?'green':h.new_status==='blocked'?'red':h.new_status==='in_progress'?'':'';
  return `<div class="tl-item">
    <div class="tl-dot ${dotClass}"></div>
    <div class="tl-time">${fmt(h.created_at)}${h.author?' · '+esc(h.author):''}${h.source_meeting_title?' · 📅 '+esc(h.source_meeting_title):''}</div>
    <div class="tl-content">
      ${changed&&h.old_status?`<div class="tl-status">${statusBadge(h.old_status)} → ${statusBadge(h.new_status)}</div>`:''}
      ${h.note?`<div class="tl-note">${esc(h.note)}</div>`:''}
    </div>
  </div>`;
}

async function submitTaskUpdate() {
  const id = state.editingTaskId;
  if(!id) return;
  const body = {
    status: document.getElementById('edit-status')?.value,
    priority: document.getElementById('edit-priority')?.value,
    owner: document.getElementById('edit-owner')?.value,
    due_date: document.getElementById('edit-due')?.value,
    description: document.getElementById('edit-desc')?.value,
    note: document.getElementById('edit-note')?.value,
    author: document.getElementById('edit-author')?.value,
    source_meeting_id: parseInt(document.getElementById('edit-src-meeting')?.value)||null,
  };
  try {
    await put('/api/tasks/'+id, body);
    toast('Tarea actualizada');
    closeModal('task-modal');
    await loadAll();
    if(state.currentView==='tasks') renderTasks();
    if(state.currentView==='dashboard') renderDashboard();
  } catch(e) { toast(e.message, true); }
}

// ===== MEETING DETAIL =====
async function openMeetingDetail(id) {
  const m = await get('/api/meetings/'+id);
  const tasks = state.tasks.filter(t=>t.meeting_id==id);
  // Show inline for now — could be a modal too
  alert(`${m.title}\n${m.date}\n\nTareas: ${tasks.length}\n\n${m.summary||'Sin resumen'}`);
}

// ===== NEW TASK =====
function openNewTask() {
  const ps = document.getElementById('nt-project');
  ps.innerHTML = '<option value="">— sin proyecto —</option>'+state.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  const ms = document.getElementById('nt-meeting');
  ms.innerHTML = '<option value="">— ninguna —</option>'+state.meetings.map(m=>`<option value="${m.id}">${m.date} — ${esc(m.title)}</option>`).join('');
  document.getElementById('new-task-modal').style.display = 'flex';
}

async function submitNewTask() {
  const title = document.getElementById('nt-title').value.trim();
  if(!title) return toast('El título es requerido', true);
  const body = {
    title,
    description: document.getElementById('nt-desc').value,
    owner: document.getElementById('nt-owner').value,
    priority: document.getElementById('nt-priority').value,
    status: document.getElementById('nt-status').value,
    due_date: document.getElementById('nt-due').value,
    project_id: parseInt(document.getElementById('nt-project').value)||null,
    meeting_id: parseInt(document.getElementById('nt-meeting').value)||null,
  };
  try {
    await post('/api/tasks', body);
    toast('Tarea creada');
    closeModal('new-task-modal');
    await loadAll();
    if(state.currentView==='tasks') renderTasks();
    if(state.currentView==='dashboard') renderDashboard();
  } catch(e) { toast(e.message, true); }
}

// ===== IMPORT MEETING =====
function openImportMeeting() {
  const ps = document.getElementById('imp-project');
  ps.innerHTML = '<option value="">— sin proyecto —</option>'+state.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  document.getElementById('import-modal').style.display = 'flex';
}

async function submitImport() {
  const path = document.getElementById('imp-path').value.trim();
  if(!path) return toast('La ruta es requerida', true);
  const body = {
    path,
    project_id: parseInt(document.getElementById('imp-project').value)||null,
    summary: document.getElementById('imp-summary').value,
  };
  try {
    const r = await post('/api/meetings/import', body);
    toast('Reunión importada: '+r.title);
    closeModal('import-modal');
    await loadAll();
    if(state.currentView==='meetings') renderMeetings();
    if(state.currentView==='dashboard') renderDashboard();
  } catch(e) { toast(e.message, true); }
}

// ===== NEW PROJECT =====
function openNewProject() {
  document.getElementById('new-project-modal').style.display = 'flex';
}

async function submitNewProject() {
  const name = document.getElementById('np-name').value.trim();
  if(!name) return toast('El nombre es requerido', true);
  try {
    await post('/api/projects', {
      name,
      description: document.getElementById('np-desc').value,
      color: document.getElementById('np-color').value,
    });
    toast('Proyecto creado');
    closeModal('new-project-modal');
    await loadAll();
  } catch(e) { toast(e.message, true); }
}

// ===== PROJECT NAV =====
function renderProjectNav() {
  const el = document.getElementById('project-nav');
  el.innerHTML = state.projects.map(p=>`
    <button class="proj-pill ${state.activeProject==p.id?'active':''}" onclick="setActiveProject(${p.id})">
      <span class="proj-dot" style="background:${p.color}"></span>
      <span>${esc(p.name)}</span>
    </button>`).join('');
}

function setActiveProject(id) {
  state.activeProject = state.activeProject==id ? null : id;
  renderProjectNav();
  if(state.currentView==='tasks') renderTasks();
  if(state.currentView==='meetings') renderMeetings();
}

// ===== SEARCH =====
function debounceSearch(q) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>runSearch(q), 300);
}

async function runSearch(q) {
  const el = document.getElementById('search-results');
  if(!q||q.length<2) { el.style.display='none'; return; }
  const results = await get('/api/search?q='+encodeURIComponent(q)).catch(()=>[]);
  if(!results||!results.length) { el.style.display='none'; return; }
  el.style.display = '';
  el.innerHTML = `<div class="card"><div class="card-header"><h2>Resultados de búsqueda: "${esc(q)}"</h2></div><div style="padding:12px">
    ${results.map(r=>`<div style="padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer" onclick="${r.kind==='task'?`openTaskDetail(${r.id})`:``}">
      <span class="pill" style="margin-right:8px">${r.kind==='task'?'Tarea':'Reunión'}</span>
      <strong style="font-size:.88em">${esc(r.title)}</strong>
      <div style="font-size:.78em;color:var(--text3);margin-top:2px">${r.snippet||''}</div>
    </div>`).join('')}
  </div></div>`;
}

// ===== HELPERS =====
function closeModal(id) { document.getElementById(id).style.display='none'; }
function esc(s){ const d=document.createElement('div');d.textContent=s;return d.innerHTML; }
function fmt(dt){ if(!dt) return '—'; try{return new Date(dt).toLocaleString('es-CO',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch{return dt}}

function statusBadge(s) {
  const labels={todo:'To Do',in_progress:'En progreso',blocked:'Bloqueado',done:'Hecho',cancelled:'Cancelado'};
  return `<span class="badge badge-${s}">${labels[s]||s}</span>`;
}
function statusLabel(s){return {todo:'To Do',in_progress:'En progreso',blocked:'Bloqueado',done:'Hecho',cancelled:'Cancelado'}[s]||s}
function prioLabel(s){return {low:'Baja',medium:'Media',high:'Alta',critical:'Crítica'}[s]||s}
function prioBadge(s){return {low:'<span style="color:var(--text3)">Baja</span>',medium:'<span style="color:var(--blue)">Media</span>',high:'<span style="color:var(--orange)">Alta</span>',critical:'<span style="color:var(--red)">Crítica</span>'}[s]||s}

function avatarHtml(name) {
  const initials = name.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  return `<div class="avatar" title="${esc(name)}">${initials}</div>`;
}

function projectColor(pid) {
  const p = state.projects.find(x=>x.id==pid);
  return p?`<span class="proj-dot" style="background:${p.color}"></span><span style="font-size:.75em;color:var(--text2)">${esc(p.name)}</span>`:'';
}

function toast(msg, isError=false) {
  const c = document.getElementById('toast');
  const el = document.createElement('div');
  el.className = 'toast-item'+(isError?' error':'');
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}

init();
</script>
</body>
</html>
